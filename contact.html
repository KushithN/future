<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-wrap">
    <form id="contactForm" class="login-card">
      <span class="mark">CRM</span>
      <h2>Contact us</h2>
      <p class="muted">Tell us what you need and we will get back to you.</p>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required />
      </div>
      <div class="field">
        <label for="message">How can we help?</label>
        <textarea id="message"></textarea>
      </div>
      <button type="submit" class="btn-primary">Send message</button>
      <p id="msg" class="muted" role="status"></p>
    </form>
  </div>

  <script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      try {
        const res = await fetch('/api/leads/public', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            message: document.getElementById('message').value,
          }),
        });
        const data = await res.json();
        msg.textContent = data.message;
        if (res.ok) e.target.reset();
      } catch (err) {
        msg.textContent = 'Could not send your message. Please try again.';
      }
    });
  </script>
</body>
</html>
